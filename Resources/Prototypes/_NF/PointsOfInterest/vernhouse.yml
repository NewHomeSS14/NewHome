# Notes:

- type: pointOfInterest
  id: Vernhouse
  parent: BasePOI
  name: "Vern's House"
  minimumDistance: 2500
  maximumDistance: 3500
  spawnGroup: Required
  gridPath: /Maps/_NF/POI/vernhouse.yml
  addComponents:
  - type: IFF
    color: "#7BB109"

- type: gameMap
  id: Vernhouse
  mapName: "Vern's House"
  mapPath: /Maps/_NF/POI/vernhouse.yml
  minPlayers: 0
  stations:
    Vernhouse:
      stationProto: RecordsFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'Expeditionary Lodge'
        - type: ExtraStationInformation
          iconPath: /Textures/_NewHome/Icons/Stations/VernHouse.png
          stationSubtext: 'frontier-lobby-exped-subtext'
          stationDescription: 'frontier-lobby-exped-description'
          lobbySortOrder: 3
        - type: StationJobs
          availableJobs:
            Contractor: [ -1, -1 ]
            Pilot: [ -1, -1 ]
            Mercenary: [ -1, -1 ]
        - type: StationDeadDropHintExempt
