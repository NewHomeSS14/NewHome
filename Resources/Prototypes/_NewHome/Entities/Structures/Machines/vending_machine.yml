# LoveVend Vending Machine

- type: entity
  parent: VendingMachine
  id: VendingMachineLove
  name: LoveVend
  description: Keeping you safe and educated.
  components:
  - type: VendingMachine
    pack: LoveVendInventory
    offState: off
    brokenState: broken
    normalState: normal-unshaded
  - type: DatasetVocalizer
    pack: LoveVendAds
  - type: SpeakOnUIClosed
    pack: LoveVendGoodbyes
  - type: Speech
  - type: PointLight
    radius: 1.5
    energy: 1.3
    color: "#FFFFFF"
  - type: Sprite
    sprite: _NewHome/Structures/Machines/VendingMachines/lovevend.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
      
